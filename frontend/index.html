<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Squad Tracker - Real-time GPS sledovani skupiny</title>
<meta name="description" content="Squad Tracker je real-time GPS sledovani polohy pro skupiny a vylety. Sdileni polohy, chat, hlasovky a bezpecne setkavani - primo v prohlizeci, bez instalace." />
<link rel="canonical" href="https://squad-tracker.site/" />
<meta property="og:type" content="website" />
<meta property="og:title" content="Squad Tracker - Real-time GPS sledovani skupiny" />
<meta property="og:description" content="Sdilej polohu, chatuj a zustan v kontaktu se svou skupinou v realnem case. Bez instalace, primo v prohlizeci." />
<meta property="og:url" content="https://squad-tracker.site/" />
<meta property="og:image" content="https://squad-tracker.site/icons/icon-192.png" />
<meta name="twitter:card" content="summary" />
<meta name="twitter:title" content="Squad Tracker - Real-time GPS sledovani skupiny" />
<meta name="twitter:description" content="Sdilej polohu, chatuj a zustan v kontaktu se svou skupinou v realnem case." />
<link rel="manifest" href="/manifest.json" />
<link rel="icon" href="/icons/icon-192.png" />
<link rel="apple-touch-icon" href="/icons/icon-192.png" />
<meta name="theme-color" content="#0a0d0c" />
<link rel="preconnect" href="https://unpkg.com" crossorigin />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" />
<style>
  :root{
    --ink:#0a0d0c;
    --panel:#101614;
    --panel-2:#151d1a;
    --line:#22322b;
    --signal:#ffb454;
    --signal-dim:#8a6a3a;
    --cyan:#4cc9f0;
    --danger:#ff5d5d;
    --text:#e7ede9;
    --text-dim:#7c8f89;
    --mono:'IBM Plex Mono', ui-monospace, monospace;
    --sans:'Inter', system-ui, sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%; margin:0; overscroll-behavior:none;}
  body{
    background:var(--ink); color:var(--text); font-family:var(--sans);
    display:flex; flex-direction:column;
  }
  #app{position:fixed; inset:0; display:flex; flex-direction:column;}

  /* ---------- JOIN SCREEN ---------- */
  #join-screen{
    flex:1; display:flex; align-items:center; justify-content:center;
    position:relative; overflow:hidden; padding:24px;
  }
  .radar-wrap{
    position:absolute; top:50%; left:50%; width:min(140vw,900px); height:min(140vw,900px);
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:
      repeating-radial-gradient(circle, transparent 0, transparent 68px, rgba(255,180,84,0.06) 69px, transparent 70px),
      radial-gradient(circle, rgba(255,180,84,0.05), transparent 60%);
    border:1px solid var(--line);
  }
  .radar-sweep{
    position:absolute; inset:0; border-radius:50%; overflow:hidden;
    animation:spin 5s linear infinite;
  }
  .radar-sweep::before{
    content:''; position:absolute; inset:0;
    background:conic-gradient(from 0deg, rgba(255,180,84,0.35), transparent 35%);
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  @media (prefers-reduced-motion: reduce){ .radar-sweep{ animation:none; } }

  .join-card{
    position:relative; z-index:2; width:100%; max-width:340px;
    background:rgba(16,22,20,0.9); border:1px solid var(--line); border-radius:4px;
    padding:28px 24px; backdrop-filter:blur(6px);
  }
  .eyebrow{
    font-family:var(--mono); font-size:11px; letter-spacing:.18em; color:var(--signal);
    text-transform:uppercase; margin:0 0 6px;
  }
  h1{ font-family:var(--mono); font-size:22px; font-weight:600; margin:0 0 20px; color:var(--text);}
  label{ display:block; font-family:var(--mono); font-size:11px; color:var(--text-dim); letter-spacing:.08em; margin:14px 0 6px; text-transform:uppercase;}
  input{
    width:100%; background:var(--panel-2); border:1px solid var(--line); color:var(--text);
    font-family:var(--mono); font-size:15px; padding:11px 12px; border-radius:3px; outline:none;
  }
  input:focus{ border-color:var(--signal); }
  button{
    width:100%; margin-top:22px; background:var(--signal); color:#1a1204; border:none;
    font-family:var(--mono); font-weight:700; font-size:14px; letter-spacing:.06em;
    padding:13px; border-radius:3px; cursor:pointer; text-transform:uppercase;
  }
  button:active{ transform:scale(0.98); }
  button:disabled{ background:var(--signal-dim); color:#3a2f18; }
  #join-error{ color:var(--danger); font-family:var(--mono); font-size:12px; margin-top:12px; min-height:14px;}

  .lang-switch{
    position:absolute; top:14px; right:14px; z-index:3; display:flex; gap:6px;
  }
  .lang-switch button{
    width:auto; margin:0; padding:6px 10px; font-size:11px; letter-spacing:.04em;
    background:rgba(16,22,20,0.9); border:1px solid var(--line); color:var(--text-dim);
    font-family:var(--mono); text-transform:uppercase; border-radius:3px;
  }
    .lang-switch button.active{ border-color:var(--signal); color:var(--signal); }

  .consent-row{
    display:flex; align-items:flex-start; gap:8px; margin-top:16px;
    font-family:var(--mono); font-size:11px; color:var(--text-dim); line-height:1.4;
    text-transform:none; cursor:pointer;
  }
  .consent-row input[type="checkbox"]{
    width:auto; margin:2px 0 0; accent-color:var(--signal); flex-shrink:0;
  }

  /* ---------- MAP SCREEN ---------- */
  #map-screen{ flex:1; display:none; flex-direction:column; position:relative;}
  #map{ flex:1; background:#0a0d0c; }
  .leaflet-container{ background:#0a0d0c; }

  #topbar{
    position:absolute; top:0; left:0; right:0; z-index:1000;
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 14px; background:linear-gradient(to bottom, rgba(10,13,12,0.92), transparent);
    font-family:var(--mono); font-size:12px;
  }
  .room-tag{ color:var(--text-dim); }
  .room-tag b{ color:var(--signal); letter-spacing:.05em; }
  #status-dot{ display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--signal); margin-right:6px; }
  #status-dot.offline{ background:var(--danger); }
  #status-dot.pulse{ animation:pulse 1.6s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.35;} }

  .topbar-right{ display:flex; align-items:center; gap:10px; }
  .icon-btn{
    position:relative; width:auto; margin:0; background:rgba(16,22,20,0.9); border:1px solid var(--line);
    color:var(--text); font-family:var(--mono); font-size:11px; padding:6px 10px; border-radius:3px;
    letter-spacing:.05em; text-transform:uppercase; cursor:pointer;
    display:flex; align-items:center; gap:5px;
  }
  .icon-btn:active{ transform:none; }
  .unread-dot{
    position:absolute; top:-4px; right:-4px; width:9px; height:9px; border-radius:50%;
    background:var(--danger); border:1px solid var(--ink); display:none;
  }
  .unread-dot.show{ display:block; }

  #hud-bottom{
    position:absolute; left:0; right:0; bottom:0; z-index:1000;
    background:linear-gradient(to top, rgba(10,13,12,0.95), transparent);
    padding:16px 12px 14px; display:flex; gap:8px; overflow-x:auto;
  }
  .chip{
    flex:0 0 auto; background:rgba(16,22,20,0.9); border:1px solid var(--line); border-radius:3px;
    padding:8px 12px; font-family:var(--mono); font-size:11px; min-width:96px;
  }
  .chip .name{ color:var(--text); font-weight:600; display:block; margin-bottom:2px;}
  .chip .dist{ color:var(--cyan); }
  .chip.self .name{ color:var(--signal); }

  #alert-toast{
    position:absolute; top:52px; left:50%; transform:translateX(-50%) translateY(-20px);
    background:var(--danger); color:#2b0a0a; font-family:var(--mono); font-weight:700;
    font-size:12px; padding:8px 14px; border-radius:3px; z-index:1100; opacity:0;
    transition:transform .25s ease, opacity .25s ease; pointer-events:none; white-space:nowrap;
  }
  #alert-toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  .squad-marker{ position:relative; width:30px; height:30px; }
  .squad-marker .dot{ width:26px; height:26px; border-radius:50%; background:var(--cyan); border:3px solid #05141a; }
  .squad-marker.me .dot{ background:var(--signal); border-color:#1a1204; }
  .squad-marker .dot.avatar-dot{ object-fit:cover; background:#05141a; }
  .squad-marker .ring{
    position:absolute; inset:-8px; border-radius:50%; border:1px solid var(--cyan); opacity:0;
    animation:ring 2.4s ease-out infinite;
  }
  .squad-marker.me .ring{ border-color:var(--signal); }
  @keyframes ring{ 0%{ transform:scale(0.4); opacity:.7;} 100%{ transform:scale(1.8); opacity:0;} }
  .marker-label{
    font-family:var(--mono); font-size:12px; font-weight:600; color:var(--text); background:rgba(10,13,12,0.85);
    padding:2px 7px; border-radius:3px; white-space:nowrap;
  }

  /* ---------- WALKIE-TALKIE ---------- */
  #ptt-btn{
    position:absolute; right:16px; bottom:96px; z-index:1000;
    width:66px; height:66px; margin:0; border-radius:50%;
    background:var(--panel-2); border:2px solid var(--signal); color:var(--signal);
    font-size:26px; display:flex; align-items:center; justify-content:center;
    padding:0; box-shadow:0 0 0 rgba(255,180,84,0.5); user-select:none;
  }
  #ptt-btn.recording{
    background:var(--danger); border-color:var(--danger); color:#2b0a0a;
    animation:ptt-pulse 1s ease-in-out infinite;
  }
  @keyframes ptt-pulse{ 0%,100%{ box-shadow:0 0 0 0 rgba(255,93,93,0.5);} 50%{ box-shadow:0 0 0 14px rgba(255,93,93,0);} }
  #ptt-label{
    position:absolute; right:14px; bottom:66px; z-index:1000; font-family:var(--mono);
    font-size:10px; color:var(--text-dim); background:rgba(10,13,12,0.85); padding:2px 6px;
    border-radius:2px; white-space:nowrap;
  }
  #speaking-indicator{
    position:absolute; top:52px; left:50%; transform:translateX(-50%); z-index:1050;
    font-family:var(--mono); font-size:12px; color:var(--cyan); background:rgba(16,22,20,0.9);
    border:1px solid var(--cyan); padding:6px 14px; border-radius:3px; opacity:0;
    transition:opacity .2s ease; pointer-events:none; white-space:nowrap;
  }
  #speaking-indicator.show{ opacity:1; }

  #map-crosshair{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    z-index:900; pointer-events:none; width:22px; height:22px;
  }
  #map-crosshair::before, #map-crosshair::after{
    content:''; position:absolute; background:var(--cyan); opacity:0.85;
  }
  #map-crosshair::before{ left:50%; top:0; bottom:0; width:2px; transform:translateX(-50%); }
  #map-crosshair::after{ top:50%; left:0; right:0; height:2px; transform:translateY(-50%); }

  /* ---------- CHAT PANEL ---------- */
  #chat-panel{
    position:absolute; inset:0; z-index:1200; background:rgba(8,11,10,0.97);
    display:none; flex-direction:column;
  }
  #chat-panel.open{ display:flex; }
  #chat-header{
    display:flex; align-items:center; justify-content:space-between; padding:14px 16px;
    border-bottom:1px solid var(--line); font-family:var(--mono);
  }
  #chat-header .title{ color:var(--signal); font-size:13px; letter-spacing:.08em; text-transform:uppercase; }
  #chat-close{ width:auto; margin:0; background:transparent; border:1px solid var(--line); color:var(--text);
    font-family:var(--mono); padding:6px 12px; font-size:12px; }
  #chat-messages{ flex:1; overflow-y:auto; padding:14px 16px; display:flex; flex-direction:column; gap:10px; }
  .chat-msg{ max-width:80%; }
  .chat-msg .who{ font-family:var(--mono); font-size:10px; color:var(--cyan); margin-bottom:2px; }
  .chat-msg.self .who{ color:var(--signal); }
  .chat-msg .bubble{
    background:var(--panel-2); border:1px solid var(--line); border-radius:3px; padding:8px 11px;
    font-size:14px; line-height:1.4; word-break:break-word;
  }
  .chat-msg.self{ align-self:flex-end; }
  .chat-msg.self .bubble{ border-color:var(--signal-dim); }
  #chat-input-row{ display:flex; gap:8px; padding:12px 16px; border-top:1px solid var(--line); }
  #chat-input-row input{ flex:1; margin:0; }
  #chat-send{ width:auto; margin:0; padding:11px 18px; }

  /* ---------- QUICK REACTIONS ---------- */
  #quick-reactions{ display:flex; gap:6px; padding:0 16px 10px; flex-wrap:wrap; }
  .quick-btn{
    width:auto; margin:0; padding:6px 10px; font-size:11px; background:var(--panel-2);
    border:1px solid var(--line); color:var(--text-dim); font-family:var(--mono);
    text-transform:none; letter-spacing:0; border-radius:3px;
  }
  .quick-btn:active{ border-color:var(--signal); color:var(--signal); }

  /* ---------- HUD chip extras: battery + staleness ---------- */
  .chip.stale{ opacity:0.5; }
  .chip .meta-row{ display:flex; align-items:center; gap:6px; margin-top:2px; }
  .chip .battery{ color:var(--text-dim); font-size:10px; }
  .chip .age{ color:var(--text-dim); font-size:10px; }
  .chip .nav-link{
    display:inline-block; margin-top:4px; color:var(--cyan); font-size:10px;
    text-decoration:none; border:1px solid var(--cyan); border-radius:2px; padding:2px 6px;
  }

  /* ---------- MEET-HERE PIN ---------- */
  #pin-btn{
    position:absolute; left:16px; bottom:96px; z-index:1000;
    width:52px; height:52px; margin:0; border-radius:50%;
    background:var(--panel-2); border:2px solid var(--cyan); color:var(--cyan);
    font-size:20px; display:flex; align-items:center; justify-content:center; padding:0;
  }
  .pin-popup{ font-family:var(--mono); font-size:12px; color:var(--text); }
  .pin-popup a{ color:var(--cyan); text-decoration:none; }
  .pin-popup .pin-clear{ color:var(--danger); margin-left:8px; cursor:pointer; }

  #poll-btn, #waypoint-btn{
    position:absolute; left:16px; z-index:1000; width:52px; height:40px; margin:0;
    background:var(--panel-2); border:1px solid var(--line); color:var(--text-dim);
    font-size:10px; font-family:var(--mono); border-radius:6px; padding:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
  }
  #poll-btn{ bottom:158px; }
  #waypoint-btn{ bottom:204px; }
  .btn-caption{ font-size:9px; letter-spacing:.03em; }

  #poll-create-panel{
    position:absolute; inset:0; z-index:1200; background:rgba(8,11,10,0.97);
    display:none; flex-direction:column; padding:24px; gap:10px;
  }
  #poll-create-panel.open{ display:flex; }
  #poll-create-panel input{ margin:0; }
  #poll-create-close{ position:absolute; top:14px; right:14px; width:auto; background:transparent; border:1.5px solid var(--danger); color:var(--danger); font-weight:700; padding:6px 12px; font-size:12px; border-radius:3px; }
  #poll-question-input{ margin-top:20px !important; }

  #poll-card{
    position:absolute; top:52px; left:16px; right:16px; z-index:1050;
    background:rgba(16,22,20,0.96); border:1px solid var(--signal); border-radius:6px;
    padding:12px 14px; display:none; font-family:var(--mono);
  }
  #poll-card.show{ display:block; }
  #poll-card-question{ color:var(--text); font-size:13px; margin-bottom:8px; padding-right:20px; }
  .poll-option-row{
    position:relative; background:var(--panel-2); border:1px solid var(--line); border-radius:3px;
    margin-bottom:6px; padding:7px 10px; font-size:12px; color:var(--text); cursor:pointer; overflow:hidden;
  }
  .poll-option-row .fill{
    position:absolute; top:0; left:0; bottom:0; background:rgba(255,180,84,0.18); z-index:0;
  }
  .poll-option-row .label{ position:relative; z-index:1; display:flex; justify-content:space-between; }
  .poll-option-row.voted{ border-color:var(--signal); }
  #poll-card-clear{ position:absolute; top:10px; right:12px; color:var(--danger); cursor:pointer; font-size:12px; }

  .waypoint-marker{
    display:flex; align-items:center; justify-content:center; width:22px; height:22px; border-radius:50%;
    background:var(--panel-2); border:2px solid var(--signal); color:var(--signal);
    font-family:var(--mono); font-size:11px; font-weight:700;
  }
  .waypoint-popup{ font-family:var(--mono); font-size:12px; color:var(--text); }
  .waypoint-popup .wp-remove{ color:var(--danger); cursor:pointer; margin-left:8px; }

  /* ---------- TOPBAR extra icon buttons ---------- */
  /* mute lives as a checkbox in Settings now, see .setting-row */

  /* ---------- SHARE PANEL ---------- */
  #share-panel{
    position:absolute; inset:0; z-index:1200; background:rgba(8,11,10,0.97);
    display:none; flex-direction:column; align-items:center; padding:60px 24px; text-align:center;
  }
  #share-panel.open{ display:flex; }
  #share-panel img{ width:200px; height:200px; border-radius:6px; border:1px solid var(--line); margin:20px 0; background:#fff; }
  #share-link{
    width:100%; max-width:320px; background:var(--panel-2); border:1px solid var(--line); color:var(--text);
    font-family:var(--mono); font-size:12px; padding:10px; border-radius:3px; text-align:center; word-break:break-all;
  }
  #share-panel .row{ display:flex; gap:8px; margin-top:14px; width:100%; max-width:320px; }
  #share-panel button{ margin:0; }
  #share-close{ position:absolute; top:14px; right:14px; width:auto; background:transparent; border:1.5px solid var(--danger); color:var(--danger); font-weight:700; padding:6px 12px; font-size:12px; border-radius:3px; }

  /* ---------- avatar color + custom marker ---------- */
  .color-row{ display:flex; align-items:center; gap:10px; margin-top:14px; }
  .color-row input[type="color"]{
    width:44px; height:36px; padding:2px; margin:0; background:var(--panel-2);
    border:1px solid var(--line); border-radius:3px; cursor:pointer;
  }
  .color-row span{ font-family:var(--mono); font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.08em; }
  .squad-marker .dot{ display:flex; align-items:center; justify-content:center; color:#0a0d0c; font-size:14px; font-weight:700; font-family:var(--mono); }
  .squad-marker.signal-lost .dot{ border-style:dashed; opacity:0.6; }

  #map-style-toggle{
    position:absolute; left:16px; top:56px; z-index:1000; width:auto; margin:0;
    padding:6px 10px; font-size:11px; background:rgba(16,22,20,0.9); border:1px solid var(--line);
    color:var(--text-dim); font-family:var(--mono);
    display:flex; align-items:center; gap:5px;
  }
  #map-style-toggle.active{ border-color:var(--cyan); color:var(--cyan); }

  #gps-lost-banner{
    position:absolute; top:52px; left:50%; transform:translateX(-50%); z-index:1050;
    font-family:var(--mono); font-size:11px; color:var(--danger); background:rgba(16,22,20,0.95);
    border:1px solid var(--danger); padding:6px 14px; border-radius:3px; display:none; white-space:nowrap;
  }
  #gps-lost-banner.show{ display:block; }

  #vehicle-prompt{
    position:absolute; top:52px; left:50%; transform:translateX(-50%); z-index:1050;
    font-family:var(--mono); font-size:11px; color:var(--text); background:rgba(16,22,20,0.97);
    border:1px solid var(--cyan); padding:10px 14px; border-radius:5px; display:none; text-align:center;
    max-width:280px;
  }
  #vehicle-prompt.show{ display:block; }
  #vehicle-prompt-btns{ display:flex; gap:6px; margin-top:8px; align-items:center; justify-content:center; }
  .vehicle-choice-btn{
    width:auto; margin:0; padding:8px; background:var(--panel-2); border:1px solid var(--line);
    color:var(--text-dim); display:flex; align-items:center; justify-content:center; border-radius:4px;
  }
  .vehicle-choice-btn:hover{ border-color:var(--cyan); color:var(--cyan); }
  #vehicle-prompt-dismiss{
    width:auto; margin:0; padding:8px 10px; background:transparent; border:1px solid var(--line); color:var(--text-dim); font-size:11px;
  }
  .squad-marker .vehicle-badge{
    position:absolute; bottom:-4px; right:-4px; width:18px; height:18px; border-radius:50%;
    background:var(--signal); color:#0a0d0c; display:flex; align-items:center; justify-content:center;
    border:2px solid #1a1204;
  }
  .squad-marker.me .vehicle-badge{ background:var(--signal); }
  .squad-marker:not(.me) .vehicle-badge{ background:var(--cyan); border-color:#05141a; }

  .chip.signal-lost{ opacity:0.4; }
  .chip.signal-lost .age{ color:var(--danger); }

  #compass-panel{
    position:absolute; inset:0; z-index:1200; background:rgba(8,11,10,0.97);
    display:none; flex-direction:column; align-items:center; justify-content:center; padding:24px; text-align:center;
  }
  #compass-panel.open{ display:flex; }
  #compass-close{ position:absolute; top:14px; right:14px; width:auto; background:transparent; border:1.5px solid var(--danger); color:var(--danger); font-weight:700; padding:6px 12px; font-size:12px; border-radius:3px; }
  #compass-dial{
    position:relative; width:220px; height:220px; border-radius:50%; margin:24px 0;
    border:2px solid var(--line); background:radial-gradient(circle, rgba(255,180,84,0.06), transparent 70%);
  }
  #compass-arrow{
    position:absolute; top:50%; left:50%; width:4px; height:88px;
    background:linear-gradient(to top, var(--signal), var(--cyan));
    transform-origin:bottom center; transform:translate(-50%,-100%) rotate(0deg);
    border-radius:2px; transition:transform .15s linear;
  }
  #compass-dial::after{
    content:''; position:absolute; top:50%; left:50%; width:10px; height:10px; border-radius:50%;
    background:var(--text); transform:translate(-50%,-50%);
  }
  #compass-distance{ font-family:var(--mono); font-size:20px; color:var(--signal); }

  /* ---------- APK link on join screen ---------- */
  /* ---------- typing indicator ---------- */
  #typing-indicator{
    font-family:var(--mono); font-size:11px; color:var(--text-dim); padding:0 16px 4px;
    min-height:16px; font-style:italic;
  }

  /* ---------- reply preview ---------- */
  #reply-preview{
    display:none; align-items:center; justify-content:space-between; gap:8px;
    margin:0 16px 8px; padding:6px 10px; background:var(--panel-2); border-left:2px solid var(--cyan);
    font-family:var(--mono); font-size:11px; color:var(--text-dim); border-radius:2px;
  }
  #reply-preview.show{ display:flex; }
  #reply-preview .txt{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #reply-preview .cancel{ cursor:pointer; color:var(--danger); flex-shrink:0; }
  .chat-msg .reply-quote{
    font-size:10px; color:var(--cyan); border-left:2px solid var(--cyan); padding-left:6px;
    margin-bottom:4px; opacity:0.8;
  }
  .chat-msg img{ max-width:180px; border-radius:4px; display:block; margin-top:4px; }
  .chat-msg .bubble{ cursor:pointer; }

  /* ---------- owner controls ---------- */
  .chip .kick-link{
    display:inline-flex; align-items:center; justify-content:center;
    width:20px; height:20px; margin-left:6px; margin-top:0; vertical-align:middle;
    color:var(--danger); font-size:12px; font-weight:700; line-height:1;
    text-decoration:none; border:1.5px solid var(--danger); border-radius:50%; padding:0;
  }
  .chip .kick-link:hover{ background:var(--danger); color:#0a0d0c; }
  .owner-badge{ color:var(--signal); font-size:9px; margin-left:4px; }

  /* ---------- settings panel ---------- */
  #settings-panel{
    position:absolute; inset:0; z-index:1200; background:rgba(8,11,10,0.97);
    display:none; flex-direction:column; padding:24px;
  }
  #settings-panel.open{ display:flex; }
  #settings-panel .setting-row{
    display:flex; align-items:center; justify-content:space-between; padding:14px 4px;
    border-bottom:1px solid var(--line); font-family:var(--mono); font-size:13px; color:var(--text);
  }
  #settings-panel .setting-row input[type="checkbox"]{ width:auto; margin:0; accent-color:var(--signal); }
  #settings-close{ position:absolute; top:14px; right:14px; width:auto; background:transparent; border:1.5px solid var(--danger); color:var(--danger); font-weight:700; padding:6px 12px; font-size:12px; border-radius:3px; }
  #stats-block{ margin-top:20px; font-family:var(--mono); font-size:12px; color:var(--text-dim); line-height:1.8; }
  #change-password-row{ display:flex; gap:8px; margin-top:16px; }
  #leave-room-btn{
    margin-top:24px; background:transparent; border:1px solid var(--danger); color:var(--danger);
    font-size:12px; padding:11px; font-weight:700;
  }
  #leave-room-btn:hover{ background:var(--danger); color:#0a0d0c; }

  /* ---------- account settings (logged-in users) ---------- */
  #account-settings-block label{ display:block; font-family:var(--mono); font-size:11px; color:var(--text-dim); margin:12px 0 4px; }
  #account-username-row{ display:flex; gap:8px; margin-top:4px; }
  #account-username-row input{ flex:1; margin:0; }
  #account-username-row button{ width:auto; margin:0; padding:0 14px; }
  #account-password-save-btn{ margin-top:12px; }
  #account-delete-toggle-btn{
    margin-top:22px; background:transparent; border:1px solid var(--danger); color:var(--danger);
    font-size:12px; padding:10px;
  }
  #account-delete-toggle-btn:hover{ background:var(--danger); color:#0a0d0c; }
  #account-delete-confirm-row{ margin-top:10px; }
  #account-delete-confirm-row input{ margin-bottom:8px; }
  #account-delete-btn{
    width:100%; background:var(--danger); color:#0a0d0c; border:none; font-weight:700; padding:11px; font-size:12px;
  }
  #change-password-row input{ flex:1; margin:0; }
  #change-password-row button{ width:auto; margin:0; padding:0 16px; }

  /* ---------- account panel ---------- */
  #account-status-bar{
    display:flex; align-items:center; gap:10px; margin:14px 0 4px; padding:10px 12px;
    background:var(--panel-2); border:1px solid var(--line); border-radius:6px;
  }
  #account-avatar-preview{
    width:32px; height:32px; border-radius:50%; object-fit:cover; border:1px solid var(--line);
    background:var(--ink);
  }
  #account-welcome-text{ flex:1; font-family:var(--mono); font-size:12px; color:var(--text); }
  #account-logout-btn{
    width:auto; margin:0; padding:6px 10px; font-size:11px; background:transparent;
    border:1px solid var(--line); color:var(--text-dim);
  }
  #open-account-btn{
    margin-top:10px; background:transparent; border:1px dashed var(--line); color:var(--cyan);
    font-size:12px; padding:10px;
  }
  #account-panel{
    position:absolute; inset:0; z-index:1300; background:rgba(8,11,10,0.98);
    display:none; flex-direction:column; padding:24px; overflow-y:auto;
  }
  #account-panel.open{ display:flex; }
  #account-close{ position:absolute; top:14px; right:14px; width:auto; background:transparent; border:1.5px solid var(--danger); color:var(--danger); font-weight:700; padding:6px 12px; font-size:12px; border-radius:3px; }
  #account-tabs{ display:flex; gap:8px; margin:12px 0 20px; }
  .account-tab{
    flex:1; margin:0; background:transparent; border:1px solid var(--line); color:var(--text-dim);
    font-size:12px; padding:10px; letter-spacing:.04em; text-transform:uppercase;
  }
  .account-tab.active{ border-color:var(--signal); color:var(--signal); }
  #login-form label, #register-form label{ display:block; font-family:var(--mono); font-size:11px; color:var(--text-dim); margin:12px 0 4px; }
  .form-error{ color:var(--danger,#ff5d5d); font-size:12px; font-family:var(--mono); min-height:16px; margin:8px 0 0; }
  #verify-form p#t-verify-info{ font-size:12px; color:var(--text-dim); margin-bottom:14px; line-height:1.5; }
  #verify-code{ text-align:center; font-size:22px; letter-spacing:.3em; font-family:var(--mono); }
  #resend-code-link{ text-align:center; color:var(--cyan); font-size:12px; margin-top:14px; cursor:pointer; text-decoration:underline; }
  .account-divider{ display:flex; align-items:center; gap:10px; margin:22px 0; color:var(--text-dim); font-size:11px; }
  .account-divider::before, .account-divider::after{ content:''; flex:1; height:1px; background:var(--line); }
  #google-login-btn{
    display:flex; align-items:center; justify-content:center; gap:10px;
    background:#fff; color:#1f1f1f; border:none; font-weight:600; font-size:13px; padding:12px;
  }
  #avatar-upload-row{ display:flex; align-items:center; gap:12px; margin-top:16px; }
  #avatar-upload-preview{
    width:44px; height:44px; border-radius:50%; object-fit:cover; border:1px solid var(--line); background:var(--panel-2);
  }
  #avatar-upload-btn{ width:auto; margin:0; padding:8px 14px; font-size:12px; }
  #admin-link-row{ margin-top:12px; }
  #admin-link-btn{
    width:100%; background:transparent; border:1px solid var(--cyan); color:var(--cyan); font-size:12px; padding:10px;
  }

  #support-link{
    position:absolute; bottom:14px; right:16px; z-index:5;
    font-family:var(--mono); font-size:11px; color:var(--text-dim); opacity:0.55;
    text-decoration:none; letter-spacing:.02em;
  }
  #support-link:hover{ opacity:0.9; color:var(--cyan); }

  /* ---------- avatar crop panel ---------- */
  #avatar-crop-panel{
    position:absolute; inset:0; z-index:1400; background:rgba(6,8,7,0.98);
    display:none; flex-direction:column; align-items:center; justify-content:center; padding:24px;
  }
  #avatar-crop-panel.open{ display:flex; }
  #crop-stage{
    position:relative; width:260px; height:260px; border-radius:50%; overflow:hidden;
    background:#000; border:1px solid var(--line); touch-action:none; cursor:grab;
  }
  #crop-stage.dragging{ cursor:grabbing; }
  #crop-image{
    position:absolute; top:0; left:0; max-width:none; max-height:none;
    transform-origin:0 0; user-select:none; -webkit-user-drag:none; pointer-events:none;
  }
  #crop-mask{
    position:absolute; inset:0; border-radius:50%; box-shadow:0 0 0 2000px rgba(6,8,7,0.55) inset;
    border:2px solid var(--signal); pointer-events:none;
  }
  #crop-zoom-row{ display:flex; align-items:center; gap:10px; width:260px; margin-top:20px; color:var(--text-dim); }
  #crop-zoom-slider{ flex:1; accent-color:var(--signal); }
  #crop-btn-row{ display:flex; gap:10px; width:260px; margin-top:20px; }
  #crop-btn-row button{ flex:1; margin:0; }
  #crop-cancel-btn{ background:transparent; border:1px solid var(--line); color:var(--text-dim); padding:11px; font-size:12px; }
  #crop-close-x{
    position:absolute; top:14px; right:14px; width:32px; height:32px; margin:0; padding:0;
    background:transparent; border:1px solid var(--danger, #ff5d5d); color:var(--danger, #ff5d5d);
    font-size:16px; line-height:1; border-radius:50%; display:flex; align-items:center; justify-content:center;
  }
  #crop-close-x:hover{ background:var(--danger, #ff5d5d); color:#0a0d0c; }
  #crop-confirm-btn{ background:var(--signal); color:#0a0d0c; font-weight:700; border:none; padding:11px; font-size:12px; }
</style>
</head>
<body>
<div id="app">

  <!-- JOIN SCREEN -->
  <div id="join-screen">
    <div class="radar-wrap"><div class="radar-sweep"></div></div>
    <div class="lang-switch" id="lang-switch">
      <button type="button" data-lang="cs">CS</button>
      <button type="button" data-lang="en">EN</button>
      <button type="button" data-lang="fr">FR</button>
      <button type="button" data-lang="es">ES</button>
      <button type="button" data-lang="ar">AR</button>
      <button type="button" data-lang="hi">HI</button>
    </div>
    <a id="support-link" href="mailto:squad.tracker.support@gmail.com?subject=Squad%20Tracker%20-%20pomoc"></a>
    <div class="join-card">
      <p class="eyebrow">// squad tracker</p>
      <h1 id="t-title">Připojit se k jednotce</h1>
      <label for="username" id="t-name-label">Tvoje jméno</label>
      <input id="username" maxlength="24" placeholder="např. Falcon" autocomplete="off" />
      <label for="room" id="t-room-label">Kód místnosti</label>
      <input id="room" maxlength="24" placeholder="např. VYLET-2026" autocomplete="off" />
      <label for="room-password" id="t-password-label">Heslo (jen pro soukromou mistnost)</label>
      <input id="room-password" type="password" maxlength="64" placeholder="volitelne" autocomplete="off" />
      <div class="color-row">
        <input type="color" id="avatar-color" value="#ffb454" />
        <span id="t-color-label">Barva znacky</span>
      </div>
      <div id="account-status-bar" style="display:none;">
        <img id="account-avatar-preview" alt="" />
        <span id="account-welcome-text"></span>
        <button type="button" id="account-logout-btn"></button>
      </div>
      <button type="button" id="open-account-btn"></button>
      <label class="consent-row" for="consent-checkbox">
        <input type="checkbox" id="consent-checkbox" />
        <span id="t-consent-label">Souhlasim se sdilenim polohy, chatu a hlasu s ostatnimi v teto mistnosti.</span>
      </label>
      <button id="join-btn">Vstoupit</button>
      <p id="join-error"></p>
    </div>
  </div>

  <!-- MAP SCREEN -->
  <div id="map-screen">
    <div id="topbar">
      <span class="room-tag"><span id="status-dot"></span><span id="t-room-prefix">ROOM</span> <b id="room-label"></b></span>
      <div class="topbar-right">
        <span class="room-tag" id="me-label"></span>
        <button class="icon-btn" id="settings-toggle"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg><span id="t-settings-btn">Settings</span></button>
        <button class="icon-btn" id="chat-toggle"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg><span id="t-chat-btn">Chat</span><span class="unread-dot" id="unread-dot"></span></button>
      </div>
    </div>
    <div id="map"></div>
    <button id="map-style-toggle" title="Satellite"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11a9 9 0 0 1 9 9"/><path d="M4 4a16 16 0 0 1 16 16"/><circle cx="5" cy="19" r="1.5" fill="currentColor" stroke="none"/></svg><span class="btn-caption">SAT</span></button>
    <div id="map-crosshair"></div>
    <div id="alert-toast"></div>
    <div id="speaking-indicator"></div>
    <div id="gps-lost-banner"></div>
    <div id="vehicle-prompt">
      <span id="t-vehicle-prompt-text"></span>
      <div id="vehicle-prompt-btns">
        <button type="button" data-vehicle="car" class="vehicle-choice-btn"></button>
        <button type="button" data-vehicle="train" class="vehicle-choice-btn"></button>
        <button type="button" data-vehicle="bus" class="vehicle-choice-btn"></button>
        <button type="button" id="vehicle-prompt-dismiss">X</button>
      </div>
    </div>
    <p id="ptt-label">DRŽ A MLUV</p>
    <button id="ptt-btn"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg></button>
    <button id="pin-btn" title="Sraz tady"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg></button>
    <button id="poll-btn" title="Poll"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg><span class="btn-caption">POLL</span></button>
    <button id="waypoint-btn" title="Add stop"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg><span class="btn-caption">STOP</span></button>
    <div id="hud-bottom"></div>

    <!-- CHAT PANEL -->
    <div id="chat-panel">
      <div id="chat-header">
        <span class="title" id="t-chat-title">Chat jednotky</span>
        <button id="chat-close">Zavřít</button>
      </div>
      <div id="chat-messages"></div>
      <div id="typing-indicator"></div>
      <div id="reply-preview">
        <span class="txt" id="reply-preview-text"></span>
        <span class="cancel" id="reply-cancel">X</span>
      </div>
      <div id="quick-reactions">
        <button class="quick-btn" id="qr-1"></button>
        <button class="quick-btn" id="qr-2"></button>
        <button class="quick-btn" id="qr-3"></button>
      </div>
      <div id="chat-input-row">
        <input type="file" id="chat-image-input" accept="image/*" style="display:none;" />
        <button id="chat-image-btn" style="width:auto; margin:0; padding:11px 14px;"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg></button>
        <input id="chat-input" maxlength="500" placeholder="Napis zpravu..." autocomplete="off" />
        <button id="chat-send">Odeslat</button>
      </div>
    </div>
  </div>

  <!-- SETTINGS PANEL -->
  <div id="settings-panel">
    <button id="settings-close">X</button>
    <p class="eyebrow" id="t-settings-title">Nastaveni</p>
    <div class="setting-row">
      <span id="t-mute-voice-label">Ztlumit prijate hlasovky</span>
      <input type="checkbox" id="mute-voice-toggle" />
    </div>
    <div class="setting-row">
      <span id="t-sound-chat">Zvuk chatu</span>
      <input type="checkbox" id="sound-chat-toggle" checked />
    </div>
    <div class="setting-row">
      <span id="t-sound-voice">Zvuk hlasovek</span>
      <input type="checkbox" id="sound-voice-toggle" checked />
    </div>
    <div class="setting-row">
      <span id="t-sound-proximity">Zvuk pri priblizeni</span>
      <input type="checkbox" id="sound-proximity-toggle" checked />
    </div>
    <div class="setting-row">
      <span id="t-notif-label">Oznameni na pozadi</span>
      <input type="checkbox" id="notif-toggle" />
    </div>
    <p class="eyebrow" id="t-features-title" style="margin-top:18px;"></p>
    <div class="setting-row">
      <span id="t-feature-compass-label"></span>
      <input type="checkbox" id="feature-compass-toggle" checked />
    </div>
    <div class="setting-row">
      <span id="t-feature-satellite-label"></span>
      <input type="checkbox" id="feature-satellite-toggle" checked />
    </div>
    <div class="setting-row">
      <span id="t-feature-polls-label"></span>
      <input type="checkbox" id="feature-polls-toggle" checked />
    </div>
    <div class="setting-row">
      <span id="t-feature-waypoints-label"></span>
      <input type="checkbox" id="feature-waypoints-toggle" checked />
    </div>
    <div id="avatar-upload-row" style="display:none;">
      <img id="avatar-upload-preview" alt="" />
      <button id="avatar-upload-btn" type="button"></button>
      <input type="file" id="avatar-upload-input" accept="image/*" style="display:none;" />
    </div>
    <div id="account-settings-block" style="display:none;">
      <p class="eyebrow" id="t-account-settings-title" style="margin-top:18px;"></p>
      <div id="account-username-row">
        <input type="text" id="account-username-input" maxlength="32" />
        <button type="button" id="account-username-save-btn"></button>
      </div>
      <p class="form-error" id="account-username-error"></p>

      <label id="t-account-current-password-label" for="account-current-password-input"></label>
      <input type="password" id="account-current-password-input" maxlength="64" autocomplete="current-password" />
      <label id="t-account-new-password-label" for="account-new-password-input"></label>
      <input type="password" id="account-new-password-input" maxlength="64" autocomplete="new-password" />
      <button type="button" id="account-password-save-btn"></button>
      <p class="form-error" id="account-password-error"></p>

      <button type="button" id="account-delete-toggle-btn"></button>
      <div id="account-delete-confirm-row" style="display:none;">
        <input type="password" id="account-delete-password-input" maxlength="64" autocomplete="current-password" />
        <button type="button" id="account-delete-btn"></button>
        <p class="form-error" id="account-delete-error"></p>
      </div>
    </div>
    <div id="admin-link-row" style="display:none;">
      <button id="admin-link-btn" type="button"></button>
    </div>
    <button id="open-share-btn" style="margin-top:16px;"></button>
    <div id="owner-controls" style="display:none;">
      <div id="change-password-row">
        <input type="password" id="new-password-input" maxlength="64" />
        <button id="change-password-btn"></button>
      </div>
    </div>
    <div id="stats-block"></div>
    <button id="leave-room-btn" type="button"></button>
  </div>

  <!-- AVATAR CROP PANEL -->

  function detectDefaultLang(){
    const saved = localStorage.getItem('sq_lang');
    if (saved && I18N[saved]) return saved;
    return 'en';
  }

    if (vars){
      for (const k in vars) str = str.replace('{' + k + '}', vars[k]);
    }
    return str;
  }

  // ---------- Avatar crop UI (Instagram-style pan + zoom in a circle) ----------
  const CROP_STAGE_SIZE = 260;
  const CROP_OUTPUT_SIZE = 400;
  let cropImgNaturalW = 0, cropImgNaturalH = 0;
  let cropBaseScale = 1, cropScale = 1, cropOffsetX = 0, cropOffsetY = 0;
  let cropDragging = false, cropDragStartX = 0, cropDragStartY = 0, cropStartOffsetX = 0, cropStartOffsetY = 0;

  function clampCropOffsets(){
    const w = cropImgNaturalW * cropScale, h = cropImgNaturalH * cropScale;
    const minX = CROP_STAGE_SIZE - w, minY = CROP_STAGE_SIZE - h;
    cropOffsetX = Math.min(0, Math.max(minX, cropOffsetX));
    cropOffsetY = Math.min(0, Math.max(minY, cropOffsetY));
  }

  function applyCropTransform(){
    cropImage.style.transform = 'translate(' + cropOffsetX + 'px,' + cropOffsetY + 'px) scale(' + cropScale + ')';
  }

  function openCropPanel(file){
    const reader = new FileReader();
    reader.onload = () => {
      cropImage.onload = () => {
        cropImgNaturalW = cropImage.naturalWidth;
        cropImgNaturalH = cropImage.naturalHeight;
        cropBaseScale = Math.max(CROP_STAGE_SIZE / cropImgNaturalW, CROP_STAGE_SIZE / cropImgNaturalH);
        cropZoomSlider.value = 100;
        cropScale = cropBaseScale;
        cropOffsetX = (CROP_STAGE_SIZE - cropImgNaturalW * cropScale) / 2;
        cropOffsetY = (CROP_STAGE_SIZE - cropImgNaturalH * cropScale) / 2;
        clampCropOffsets();
        applyCropTransform();
        avatarCropPanel.classList.add('open');
      };
      cropImage.src = reader.result;
    };
    reader.readAsDataURL(file);
  }

  avatarUploadInput.addEventListener('change', () => {
    const file = avatarUploadInput.files && avatarUploadInput.files[0];
    if (!file) return;
    openCropPanel(file);
  });

    cropDragging = true;
    cropStage.classList.add('dragging');
    const p = e.touches ? e.touches[0] : e;
    cropDragStartX = p.clientX; cropDragStartY = p.clientY;
    cropStartOffsetX = cropOffsetX; cropStartOffsetY = cropOffsetY;
  }
  function cropPointerMove(e){
    if (!cropDragging) return;
    const p = e.touches ? e.touches[0] : e;
    cropOffsetX = cropStartOffsetX + (p.clientX - cropDragStartX);
    cropOffsetY = cropStartOffsetY + (p.clientY - cropDragStartY);
    clampCropOffsets();
    applyCropTransform();
    if (e.cancelable) e.preventDefault();
  }
  function cropPointerUp(){
    cropDragging = false;
    cropStage.classList.remove('dragging');
  }
  cropStage.addEventListener('mousedown', cropPointerDown);
  cropStage.addEventListener('touchstart', cropPointerDown, {passive:true});
  window.addEventListener('mousemove', cropPointerMove);
  window.addEventListener('touchmove', cropPointerMove, {passive:false});
  window.addEventListener('mouseup', cropPointerUp);
  window.addEventListener('touchend', cropPointerUp);

    const imgCx = (cx - cropOffsetX) / cropScale, imgCy = (cy - cropOffsetY) / cropScale;
    cropScale = cropBaseScale * zoomFactor;
    cropOffsetX = cx - imgCx * cropScale;
    cropOffsetY = cy - imgCy * cropScale;
    clampCropOffsets();
    applyCropTransform();
  });

  function urlBase64ToUint8Array(base64String){
    const padding = '='.repeat((4 - base64String.length % 4) % 4);
    const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
    const rawData = atob(base64);
    const outputArray = new Uint8Array(rawData.length);
    for (let i = 0; i < rawData.length; i++) outputArray[i] = rawData.charCodeAt(i);
    return outputArray;
  }

  async function subscribeToPush(){
    if (!('Notification' in window) || !('serviceWorker' in navigator) || !('PushManager' in window)){
      showToast(t('pushUnavailable'));
      notifToggle.checked = false;
      return;
    }
    const perm = await Notification.requestPermission();
    if (perm !== 'granted'){
      notifToggle.checked = false;
      return;
    }
    try {
      if (!swRegistration) swRegistration = await navigator.serviceWorker.ready;
      const res = await fetch('/vapid-public-key');
      const info = await res.json();
      if (!info.enabled){
        localStorage.setItem('sq_push_enabled', 'on'); // background-tab notifications still work via notifyBackground()
        return;
      }
      let sub = await swRegistration.pushManager.getSubscription();
      if (!sub){
        sub = await swRegistration.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: urlBase64ToUint8Array(info.key),
        });
      }
      localStorage.setItem('sq_push_enabled', 'on');
      if (ws && ws.readyState === WebSocket.OPEN){
        ws.send(JSON.stringify({type:'push_subscribe', device_id: deviceId, subscription: sub.toJSON()}));
      }
    } catch (e){
      notifToggle.checked = false;
      localStorage.setItem('sq_push_enabled', 'off');
    }
  }

  function haversine(lat1, lng1, lat2, lng2){
    const R = 6371000;
    const toRad = d => d * Math.PI / 180;
    const dphi = toRad(lat2-lat1), dl = toRad(lng2-lng1);
    const a = Math.sin(dphi/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dl/2)**2;
    return 2 * R * Math.asin(Math.sqrt(a));
  }

  // ---------- COMPASS ----------
  let compassTarget = null;
  let compassHeading = 0;

  function bearingTo(lat1, lng1, lat2, lng2){
    const toRad = d => d * Math.PI / 180, toDeg = r => r * 180 / Math.PI;
    const dLng = toRad(lng2 - lng1);
    const y = Math.sin(dLng) * Math.cos(toRad(lat2));
    const x = Math.cos(toRad(lat1)) * Math.sin(toRad(lat2)) - Math.sin(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.cos(dLng);
    return (toDeg(Math.atan2(y, x)) + 360) % 360;
  }

  function updateCompassArrow(){
    if (!compassTarget || !selfLatLng) return;
    const bearing = bearingTo(selfLatLng.lat, selfLatLng.lng, compassTarget.lat, compassTarget.lng);
    const angle = (bearing - compassHeading + 360) % 360;
    compassArrow.style.transform = 'rotate(' + angle + 'deg)';
    const dist = haversine(selfLatLng.lat, selfLatLng.lng, compassTarget.lat, compassTarget.lng);
    compassDistance.textContent = dist < 1000 ? Math.round(dist) + ' m' : (dist / 1000).toFixed(1) + ' km';
  }

  function handleOrientation(e){
    let heading;
    if (typeof e.webkitCompassHeading === 'number'){
      heading = e.webkitCompassHeading;
    } else if (e.alpha != null){
      heading = 360 - e.alpha;
    } else {
      return;
    }
    compassHeading = heading;
    updateCompassArrow();
  }

    const eventName = 'ondeviceorientationabsolute' in window ? 'deviceorientationabsolute' : 'deviceorientation';
    window.addEventListener(eventName, handleOrientation);
  }

  // ---------- WALKIE-TALKIE ----------
  let activeStream = null;
  let mediaRecorder = null;
  let recordedChunks = [];
  let isRecording = false;

  // Inside the APK, Android WebView's own getUserMedia+MediaRecorder combo is
  // unreliable ("Could not start audio source"). When running as a native app,
  // use the native Capacitor plugin instead, which records via Android's own
  // MediaRecorder API and bypasses the broken WebView audio path entirely.
  // On the plain website this plugin isn't present, so it just falls back to
  // the normal Web Audio path below, which already works fine there.
  const isNativeApp = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
  const NativeVoiceRecorder = (isNativeApp && window.Capacitor.Plugins) ? window.Capacitor.Plugins.VoiceRecorder : null;

  function releaseStream(){
    if (activeStream){
      activeStream.getTracks().forEach(tr => tr.stop());
      activeStream = null;
    }
  }

  function pickMimeType(){
    const candidates = ['audio/webm;codecs=opus', 'audio/webm', 'audio/ogg;codecs=opus', 'audio/ogg'];
    for (const c of candidates){
      if (window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(c)) return c;
    }
    return '';
  }

  function blobToBase64(blob){
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onloadend = () => resolve(reader.result.split(',')[1]);
      reader.onerror = reject;
      reader.readAsDataURL(blob);
    });
  }

  async function startRecording(){
    if (isRecording) return;

    if (NativeVoiceRecorder){
      try {
        const hasPerm = await NativeVoiceRecorder.hasAudioRecordingPermission();
        if (!hasPerm.value){
          const req = await NativeVoiceRecorder.requestAudioRecordingPermission();
          if (!req.value){
            showToast(t('micUnavailable'));
            return;
          }
        }
        await NativeVoiceRecorder.startRecording();
        isRecording = true;
        pttBtn.classList.add('recording');
      } catch (err){
        showToast(t('micError', {err: (err && err.message) ? err.message : String(err)}));
      }
      return;
    }

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      showToast(t('micUnavailable'));
      return;
    }
    try {
      // Request a FRESH stream every time instead of reusing a cached one.
      // Android WebView can leave a previously-granted stream in a broken
      // state after it has been idle, which is what causes
      // "Could not start audio source" even though permission is granted.
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      activeStream = stream;
      recordedChunks = [];
      const mimeType = pickMimeType();
      mediaRecorder = mimeType ? new MediaRecorder(stream, { mimeType }) : new MediaRecorder(stream);
      mediaRecorder.ondataavailable = (e) => { if (e.data && e.data.size > 0) recordedChunks.push(e.data); };
      mediaRecorder.onerror = (e) => {
        isRecording = false;
        pttBtn.classList.remove('recording');
        releaseStream();
        const msg = (e.error && e.error.message) ? e.error.message : 'recording failed';
        showToast(t('micError', {err: msg}));
      };
      mediaRecorder.start();
      isRecording = true;
      pttBtn.classList.add('recording');
    } catch (err){
      releaseStream();
      showToast(t('micError', {err: err.message}));
    }
  }

  function stopRecording(){
    if (!isRecording) return;
    isRecording = false;
    pttBtn.classList.remove('recording');

    if (NativeVoiceRecorder){
      NativeVoiceRecorder.stopRecording().then((result) => {
        const data = result && result.value;
        if (data && data.recordDataBase64 && data.recordDataBase64.length > 400 &&
            ws && ws.readyState === WebSocket.OPEN){
          ws.send(JSON.stringify({
            type: 'voice',
            audio: data.recordDataBase64,
            mime: data.mimeType || 'audio/aac'
          }));
        }
      }).catch((err) => {
        showToast(t('micError', {err: (err && err.message) ? err.message : String(err)}));
      });
      return;
    }

    if (!mediaRecorder) return;
    const finish = () => {
      const blob = new Blob(recordedChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
      recordedChunks = [];
      releaseStream();
      if (blob.size < 400) return; // too short / accidental tap
      blobToBase64(blob).then((b64) => {
        if (ws && ws.readyState === WebSocket.OPEN){
          ws.send(JSON.stringify({ type:'voice', audio:b64, mime: blob.type || 'audio/webm' }));
        }
      });
    };
    mediaRecorder.onstop = finish;
    if (mediaRecorder.state !== 'inactive') mediaRecorder.stop();
  }

  pttBtn.addEventListener('touchstart', (e) => { e.preventDefault(); startRecording(); }, { passive:false });
  pttBtn.addEventListener('touchend', (e) => { e.preventDefault(); stopRecording(); }, { passive:false });
  pttBtn.addEventListener('touchcancel', (e) => { e.preventDefault(); stopRecording(); }, { passive:false });
  pttBtn.addEventListener('mousedown', startRecording);
  pttBtn.addEventListener('mouseup', stopRecording);
  pttBtn.addEventListener('mouseleave', () => { if (isRecording) stopRecording(); });

  let voiceQueue = [];
  let voicePlaying = false;
  function enqueueVoice(who, audioB64, mime){
    voiceQueue.push({who, audioB64, mime});
    if (!voicePlaying) playNextVoice();
  }
  function playNextVoice(){
    if (voiceQueue.length === 0){ voicePlaying = false; return; }
    voicePlaying = true;
    const {who, audioB64, mime} = voiceQueue.shift();
    showSpeaking(who);
    if (voiceMuted){ playNextVoice(); return; }
    let bytes;
    try {
      const byteChars = atob(audioB64);
      bytes = new Uint8Array(byteChars.length);
      for (let i = 0; i < byteChars.length; i++) bytes[i] = byteChars.charCodeAt(i);
    } catch(e){ playNextVoice(); return; }
    const blob = new Blob([bytes], { type: mime || 'audio/webm' });
    const url = URL.createObjectURL(blob);
    const audioEl = new Audio(url);
    audioEl.onended = () => { URL.revokeObjectURL(url); playNextVoice(); };
    audioEl.onerror = () => { URL.revokeObjectURL(url); playNextVoice(); };
    audioEl.play().catch(() => { URL.revokeObjectURL(url); playNextVoice(); });
  }

  function connect(){
    ws = new WebSocket(wsUrl());

    ws.onopen = () => {
      reconnectDelay = 1000;
      statusDot.classList.remove('offline','pulse');
      ws.send(JSON.stringify({type:'join', username, room, password: roomPassword, color: avatarColor.value, device_id: deviceId, avatar: myAvatarUrl}));
    };

    ws.onmessage = (evt) => {
      let msg;
      try { msg = JSON.parse(evt.data); } catch(e){ return; }

      if (msg.type === 'joined'){
        joinBtn.disabled = false;
        isOwner = !!msg.is_owner;
        if (joinScreen.style.display !== 'none'){
          joinScreen.style.display = 'none';
          mapScreen.style.display = 'flex';
          roomLabel.textContent = room;
          meLabel.textContent = username;
          if (!map) initMap();
          requestWakeLock();
        }
        startGeolocation();
        if (pushWasEnabled) subscribeToPush();
      } else if (msg.type === 'push_subscribed'){
        // server confirmed; nothing else to do, subscription is already active client-side
      } else if (msg.type === 'join_error'){
        joinBtn.disabled = false;
        joinError.textContent = t('wrongPassword');
        intentionalClose = true;
        ws.close();
      } else if (msg.type === 'kicked'){
        showToast(t('kickedMsg'));
        intentionalClose = true;
        ws.close();
        mapScreen.style.display = 'none';
        joinScreen.style.display = 'flex';
      } else if (msg.type === 'password_changed'){
        showToast(t('shareCopied'));
      } else if (msg.type === 'room_stats'){
        statsBlock.innerHTML =
          '<div>' + t('statsMembers') + ': ' + msg.member_count + '</div>' +
          '<div>' + t('statsMessages') + ': ' + msg.message_count + '</div>';
      } else if (msg.type === 'presence'){
        const activeNames = new Set(msg.users.map(u => u.username));
        msg.users.forEach(u => {
          if (u.lat != null) upsertMarker(u.username, u.lat, u.lng, u.username === username, u.color, u.username !== username && u.age_s != null && u.age_s > SIGNAL_LOST_THRESHOLD_S, u.avatar, u.vehicle, u.speed_mps);
          if (compassTarget && u.username === compassTarget.name && u.lat != null){
            compassTarget.lat = u.lat;
            compassTarget.lng = u.lng;
            updateCompassArrow();
          }
          if (u.username === username){ ownSpeedMps = u.speed_mps; maybeShowVehiclePrompt(); }
        });
        removeStaleMarkers(activeNames);
        renderHud(msg.users);
        if (pinLatLng) updatePinPopup();
      } else if (msg.type === 'proximity_alert'){
        showToast(t('proximity', {name: msg.with, dist: Math.round(msg.distance_m)}));
        if (soundProximityOn){
          if (navigator.vibrate) navigator.vibrate(200);
          notifyBackground('Squad Tracker', t('proximity', {name: msg.with, dist: Math.round(msg.distance_m)}));
        }
      } else if (msg.type === 'chat'){
        appendChatMessage(msg.username, msg.text, msg.username === username, msg.image, msg.reply_to);
        if (soundChatOn && msg.username !== username) notifyBackground(msg.username, msg.text || '[image]');
      } else if (msg.type === 'chat_history'){
        msg.messages.forEach(m => appendChatMessage(m.username, m.text, m.username === username, m.image, m.reply_to));
      } else if (msg.type === 'typing'){
        typingIndicator.textContent = t('typingText', {name: msg.username});
        clearTimeout(typingIndicatorTimeout);
        typingIndicatorTimeout = setTimeout(() => { typingIndicator.textContent = ''; }, 3000);
      } else if (msg.type === 'voice'){
        enqueueVoice(msg.username, msg.audio, msg.mime);
        if (soundVoiceOn){
          if (navigator.vibrate) navigator.vibrate(80);
          notifyBackground(msg.username, t('speaking', {name: msg.username}));
        }
      } else if (msg.type === 'pin'){
        setPinMarker(msg.lat, msg.lng, msg.by);
      } else if (msg.type === 'pin_clear'){
        clearPinMarker();
      } else if (msg.type === 'poll'){
        renderPollCard(msg);
      } else if (msg.type === 'poll_clear'){
        hidePollCard();
      } else if (msg.type === 'waypoints'){
        renderWaypoints(msg.waypoints);
      }
    };

    ws.onclose = () => {
      statusDot.classList.add('offline','pulse');
      if (intentionalClose){
        intentionalClose = false;
        return;
      }
      setTimeout(connect, reconnectDelay);
      reconnectDelay = Math.min(reconnectDelay * 1.8, 20000);
    };

    ws.onerror = () => { ws.close(); };
  }

  let lastFixTimestamp = null;
  let signalLostInterval = null;

  function checkOwnSignalLoss(){
    if (lastFixTimestamp == null) return;
    const ageS = (Date.now() - lastFixTimestamp) / 1000;
    if (ageS > 120){
      const lastTime = new Date(lastFixTimestamp).toLocaleTimeString().slice(0,5);
      gpsLostBanner.textContent = t('gpsLost', {time: lastTime});
      gpsLostBanner.classList.add('show');
    } else {
      gpsLostBanner.classList.remove('show');
    }
  }

  let accuracyCircle = null;
  const GPS_ACCURACY_REJECT_M = 300; // fixes worse than this are almost certainly IP/cell fallback, not real GPS - skip broadcasting them

  function startGeolocation(){
    if (watchId !== null) return;
    if (!navigator.geolocation){
      showToast(t('geoUnavailable'));
      return;
    }
    signalLostInterval = setInterval(checkOwnSignalLoss, 15000);
    watchId = navigator.geolocation.watchPosition(
      (pos) => {
        const {latitude, longitude, accuracy} = pos.coords;
        selfLatLng = {lat:latitude, lng:longitude};
        lastFixTimestamp = Date.now();
        gpsLostBanner.classList.remove('show');
        if (compassTarget) updateCompassArrow();
        if (map._initialCentered !== true){
          map.setView([latitude, longitude], 16);
          map._initialCentered = true;
        }
        if (map && typeof L.circle === 'function' && accuracy != null){
          if (accuracyCircle){
            accuracyCircle.setLatLng([latitude, longitude]).setRadius(accuracy);
          } else {
            accuracyCircle = L.circle([latitude, longitude], {
              radius: accuracy, color: 'var(--cyan)', weight: 1, fillColor: 'var(--cyan)', fillOpacity: 0.08, interactive: false
            }).addTo(map);
          }
        }
        // Skip broadcasting fixes so imprecise they're almost certainly not real GPS
        // (e.g. IP-based fallback indoors) - keeps everyone else's view accurate rather
        // than showing a marker that jumped hundreds of meters off.
        if (accuracy != null && accuracy > GPS_ACCURACY_REJECT_M) return;
        if (ws && ws.readyState === WebSocket.OPEN){
          const payload = {type:'location', lat:latitude, lng:longitude};
          if (batteryLevel != null) payload.battery = batteryLevel;
          if (vehicleType) payload.vehicle = vehicleType;
          ws.send(JSON.stringify(payload));
        }
      },
      (err) => { showToast(t('geoError', {err: err.message})); checkOwnSignalLoss(); },
      { enableHighAccuracy:true, maximumAge:1000, timeout:15000 }
    );
  }

  let streetLayer = null;
  let satelliteLayer = null;
  let satelliteOn = localStorage.getItem('sq_satellite') === 'on';

  function initMap(){
    map = L.map('map', {zoomControl:false, attributionControl:false}).setView([49.47,17.11], 13);
    streetLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19});
    satelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {maxZoom:19});
    (satelliteOn ? satelliteLayer : streetLayer).addTo(map);
    mapStyleToggle.classList.toggle('active', satelliteOn);
  }

  function toggleMapStyle(){
    satelliteOn = !satelliteOn;
    localStorage.setItem('sq_satellite', satelliteOn ? 'on' : 'off');
    if (satelliteOn){
      map.removeLayer(streetLayer);
      satelliteLayer.addTo(map);
    } else {
      map.removeLayer(satelliteLayer);
      streetLayer.addTo(map);
    }
    mapStyleToggle.classList.toggle('active', satelliteOn);
  }
  mapStyleToggle.addEventListener('click', toggleMapStyle);

  // ---------- MEET-HERE PIN ----------
  window.__clearPin = () => {
    if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({type:'pin_clear'}));
  };

  function buildPinPopupHtml(lat, lng, by){
    let etaHtml = '';
    if (selfLatLng){
      const dist = haversine(selfLatLng.lat, selfLatLng.lng, lat, lng);
      const eta = formatEta(dist, ownSpeedMps);
      if (eta) etaHtml = '<br/>' + t('etaLabel', {eta});
    }
    return '<div class="pin-popup">' + t('pinPopup', {by: escapeHtml(by)}) + etaHtml +
      '<br/><a href="geo:' + lat + ',' + lng + '?q=' + lat + ',' + lng + '" target="_blank">' + t('navigate') + '</a>' +
      '<span class="pin-clear" onclick="window.__clearPin()">' + t('clearPin') + '</span></div>';
  }

  function updatePinPopup(){
    if (!pinMarker || !pinLatLng) return;
    pinMarker.setPopupContent(buildPinPopupHtml(pinLatLng.lat, pinLatLng.lng, pinBy));
  }

  function setPinMarker(lat, lng, by){
    if (!map) return;
    if (pinMarker) map.removeLayer(pinMarker);
    pinLatLng = {lat, lng};
    pinBy = by;
    const icon = L.divIcon({
      className: '',
      html: '<div class="squad-marker"><div class="dot" style="background:var(--cyan)"></div></div>',
      iconSize: [16,16],
      iconAnchor: [8,8]
    });
    pinMarker = L.marker([lat, lng], {icon}).bindPopup(buildPinPopupHtml(lat, lng, by)).addTo(map);
    showToast(t('pinSet'));
  }

  function clearPinMarker(){
    if (pinMarker && map){
      map.removeLayer(pinMarker);
      pinMarker = null;
      pinLatLng = null;
      pinBy = null;
      showToast(t('pinCleared'));
    }
  }

  pinBtn.addEventListener('click', () => {
    if (!map){
      showToast(t('geoUnavailable'));
      return;
    }
    const center = map.getCenter();
    if (ws && ws.readyState === WebSocket.OPEN){
      ws.send(JSON.stringify({type:'pin', lat: center.lat, lng: center.lng}));
    }
  });

  // ---------- POLL ----------
  pollBtn.addEventListener('click', () => {
    pollQuestionInput.value = '';
    pollOptionInput1.value = '';
    pollOptionInput2.value = '';
    pollOptionInput3.value = '';
    pollCreatePanel.classList.add('open');
  });
  pollCreateClose.addEventListener('click', () => pollCreatePanel.classList.remove('open'));
  pollCreateSubmit.addEventListener('click', () => {
    const question = pollQuestionInput.value.trim();
    const options = [pollOptionInput1.value.trim(), pollOptionInput2.value.trim(), pollOptionInput3.value.trim()]
      .filter(o => o.length > 0);
    if (!question || options.length < 2){
      showToast(t('pollNeedsOptions'));
      return;
    }
    if (!ws || ws.readyState !== WebSocket.OPEN){
      showToast(t('notConnected'));
      return;
    }
    ws.send(JSON.stringify({type:'poll_create', question, options}));
    pollCreatePanel.classList.remove('open');
  });

  let activePoll = null;

  function renderPollCard(poll){
    activePoll = poll;
    pollCardQuestion.textContent = poll.question;
    pollCardOptions.innerHTML = '';
    const total = poll.total_votes || 0;
    poll.options.forEach((opt, idx) => {
      const count = poll.counts[idx] || 0;
      const pct = total > 0 ? Math.round((count / total) * 100) : 0;
      const row = document.createElement('div');
      row.className = 'poll-option-row';
      row.innerHTML =
        '<div class="fill" style="width:' + pct + '%"></div>' +
        '<div class="label"><span>' + escapeHtml(opt) + '</span><span>' + count + ' (' + pct + '%)</span></div>';
      row.addEventListener('click', () => {
        if (ws && ws.readyState === WebSocket.OPEN){
          ws.send(JSON.stringify({type:'poll_vote', option: idx}));
        }
      });
      pollCardOptions.appendChild(row);
    });
    pollCardClear.style.display = (poll.by === username || isOwner) ? 'block' : 'none';
    pollCard.classList.add('show');
  }

  function hidePollCard(){
    activePoll = null;
    pollCard.classList.remove('show');
  }

  pollCardClear.addEventListener('click', () => {
    if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({type:'poll_clear'}));
  });

  // ---------- WAYPOINTS / ROUTE ----------
  let waypointMarkers = [];
  let waypointLine = null;

  waypointBtn.addEventListener('click', () => {
    if (!map){
      showToast(t('geoUnavailable'));
      return;
    }
    const label = (window.prompt(t('waypointLabelPrompt')) || '').trim().slice(0, 40);
    const center = map.getCenter();
    if (ws && ws.readyState === WebSocket.OPEN){
      ws.send(JSON.stringify({type:'waypoint_add', lat: center.lat, lng: center.lng, label}));
    }
  });

  window.__removeWaypoint = (id) => {
    if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({type:'waypoint_remove', id}));
  };

  function renderWaypoints(waypoints){
    waypointMarkers.forEach(m => map.removeLayer(m));
    waypointMarkers = [];
    if (waypointLine){ map.removeLayer(waypointLine); waypointLine = null; }
    if (!waypoints || waypoints.length === 0) return;

    waypoints.forEach((wp, idx) => {
      const icon = L.divIcon({
        className: '',
        html: '<div class="waypoint-marker">' + (idx + 1) + '</div>',
        iconSize: [22, 22],
        iconAnchor: [11, 11],
      });
      const label = wp.label ? escapeHtml(wp.label) : t('waypointBtnTitle') + ' ' + (idx + 1);
      const popupHtml = '<div class="waypoint-popup">' + label +
        '<br/><a href="geo:' + wp.lat + ',' + wp.lng + '?q=' + wp.lat + ',' + wp.lng + '" target="_blank">' + t('navigate') + '</a>' +
        '<span class="wp-remove" onclick="window.__removeWaypoint(' + wp.id + ')">' + t('clearPin') + '</span></div>';
      const marker = L.marker([wp.lat, wp.lng], {icon}).bindPopup(popupHtml).addTo(map);
      waypointMarkers.push(marker);
    });
    if (waypoints.length > 1 && L.polyline){
      waypointLine = L.polyline(waypoints.map(w => [w.lat, w.lng]), {color: 'var(--signal)', weight: 2, dashArray: '4,6'}).addTo(map);
    }
  }

  // ---------- MUTE TOGGLE (persisted, lives inside Settings) ----------
  voiceMuted = localStorage.getItem('sq_voice_muted') === 'on';
  muteVoiceToggle.checked = voiceMuted;
  muteVoiceToggle.addEventListener('change', () => {
    voiceMuted = muteVoiceToggle.checked;
    localStorage.setItem('sq_voice_muted', voiceMuted ? 'on' : 'off');
  });

  // ---------- QUICK REACTIONS ----------
  function sendQuickReaction(key){
    const text = t(key);
    if (!ws || ws.readyState !== WebSocket.OPEN){
      showToast(t('notConnected'));
      return;
    }
    ws.send(JSON.stringify({type:'chat', text}));
    appendChatMessage(username, text, true);
  }
  qr1.addEventListener('click', () => sendQuickReaction('react1'));
  qr2.addEventListener('click', () => sendQuickReaction('react2'));
  qr3.addEventListener('click', () => sendQuickReaction('react3'));

  // ---------- SHARE PANEL (opened from Settings) ----------
  function openSharePanel(){
    const url = location.origin + location.pathname + '?room=' + encodeURIComponent(room);
    shareLink.textContent = url;
    shareQr.src = 'https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=' + encodeURIComponent(url);
    if (navigator.share){
      shareNativeBtn.style.display = 'block';
    }
    settingsPanel.classList.remove('open');
    sharePanel.classList.add('open');
  }
  openShareBtn.addEventListener('click', openSharePanel);
  shareClose.addEventListener('click', () => sharePanel.classList.remove('open'));
  shareCopyBtn.addEventListener('click', () => {
    navigator.clipboard.writeText(shareLink.textContent).then(() => {
      showToast(t('shareCopied'));
    }).catch(() => {});
  });
  shareNativeBtn.addEventListener('click', () => {
    if (navigator.share){
      navigator.share({ title: 'Squad Tracker', url: shareLink.textContent }).catch(() => {});
    }
  });

  joinBtn.addEventListener('click', () => {
    const u = usernameInput.value.trim();
    const r = roomInput.value.trim();
    if (!u || !r){
      joinError.textContent = t('joinError');
      return;
    }
    if (!consentCheckbox.checked){
      joinError.textContent = t('consentRequired');
      return;
    }
    username = u; room = r; roomPassword = roomPasswordInput.value;
    joinError.textContent = '';
    joinBtn.disabled = true;
    connect(); // screen switches only after the server confirms with "joined"
  });
})();
</script>
